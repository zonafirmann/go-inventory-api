version: 2
updates:
  # Maintain dependencies for Go Modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly" # Mengecek pembaruan setiap minggu
    labels:
      - "dependencies"
      - "backend"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"